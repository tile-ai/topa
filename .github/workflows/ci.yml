name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . ruff==0.17.4
      - name: Lint
        run: ruff check --output-format github src tests
      - name: Check the installed package data
        run: |
          python - <<'PY'
          import subprocess
          from importlib.resources import files
          from pathlib import Path

          installed = Path(str(files("topa")))
          tracked = subprocess.run(["git", "ls-files", "-z", "src/topa/kit", "src/topa/knowledge"],
                                   check=True, capture_output=True, text=True).stdout.split("\0")
          missing = [p for p in tracked if p and not (installed / Path(p).relative_to("src/topa")).is_file()]
          assert not missing, f"missing from the installed package: {missing}"
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
