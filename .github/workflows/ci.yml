name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . ruff==0.17.4
      - name: Lint
        run: ruff check --output-format github src tests
      - name: Check the installed package data
        run: |
          python - <<'PY'
          import subprocess
          from importlib.resources import files
          from pathlib import Path

          installed = Path(str(files("topa")))
          tracked = subprocess.run(["git", "ls-files", "-z", "src/topa/kit", "src/topa/knowledge"],
                                   check=True, capture_output=True, text=True).stdout.split("\0")
          missing = [p for p in tracked if p and not (installed / Path(p).relative_to("src/topa")).is_file()]
          assert not missing, f"missing from the installed package: {missing}"
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Run gitleaks
        run: gitleaks git . --redact --no-banner

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.11"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color
