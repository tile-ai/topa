[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topa"
version = "0.1.0"
description = "TileFoundry and TileOps: a path to autonomous kernel engineering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
topa = "topa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topa = ["kit/**/*", "kit/**/.gitkeep", "knowledge/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
